      theme: {
        extend: {

            'card-float': 'cardFloat 6s ease-in-out infinite',
            'gradient': 'gradient 3s ease infinite',

          keyframes: {
            cardFloat: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-10px)' }
            },
            gradient: {
              '0%': { backgroundPosition: '0% 50%' },

    }
    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .gradient-text {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient 4s ease infinite;
    }
    .book-card {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .book-card:hover {
      transform: translateY(-12px) scale(1.02);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .rating-stars {
      display: flex;
      gap: 0.25rem;
    }
    .rating-stars .filled { color: #fbbf24; }
    .rating-stars .empty { color: #64748b; }
    .active-genre { 
      background: linear-gradient(135deg, #3b82f6, #8b5cf6) !important; 
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.4) !important;
      transform: scale(1.05);
    }
    .book-description {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>

    // 🧙‍♂️ Genre Icons
    function getGenreIcon(genre) {
      const icons = {
        fantasy: '🧙‍♂️', scifi: '🚀', mystery: '🔍', romance: '💕', romcom: '😂💕',
        thriller: '🗡️', historical: '📜', horror: '👻', horrorcomedy: '💀😂', trending: '🔥',
        book: '📚'
      };
      return icons[genre] || '📚';
    }

    // ⭐ Rating Stars
    function generateStars(rating) {
      let stars = '';
      for (let i = 1; i <= 5; i++) {
        stars += i <= Math.floor(rating) 
          ? '<i class="fas fa-star filled"></i>'
          : (rating >= i - 0.5 ? '<i class="fas fa-star-half-alt filled"></i>' : '<i class="far fa-star empty"></i>');
      }
      return stars;
    }

    // 📱 Render 6 Books for Selected Genre
    function renderBooks(genre) {
      const books = booksDatabase[genre] || [];
      const grid = document.getElementById('bookGrid');
      grid.innerHTML = '';

      if (books.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-20">
            <div class="text-6xl mb-6">📚</div>
            <h3 class="text-2xl font-bold mb-4">No books in this zone yet</h3>
          </div>
        `;
        return;
      }

      books.slice(0, 6).forEach((book, index) => {
        const card = document.createElement('div');
        card.className = 'book-card glass p-8 rounded-3xl border border-white/10 hover:border-blue-500/50 cursor-pointer group';
        card.style.animationDelay = `${index * 0.1}s`;
        
        card.innerHTML = `
          <div class="mb-6 h-80 flex flex-col">
            <div class="text-4xl mb-4">${getGenreIcon(book.genre)}</div>
            <h3 class="font-black text-2xl mb-3 group-hover:text-blue-400 transition-all leading-tight">${book.title}</h3>
            <p class="text-gray-400 mb-4">${book.author}</p>
            <p class="book-description text-gray-400 text-sm leading-relaxed flex-1">${book.description}</p>
            <div class="flex items-center justify-between mt-auto pt-4">
              <div class="rating-stars text-lg">${generateStars(book.rating)}</div>
            </div>
          </div>
       
        `;
        grid.appendChild(card);
      });
    }

    // 🎛️ Genre Filter Event Listeners
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('.genre-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          // Remove active class from all buttons
          document.querySelectorAll('.genre-btn').forEach(b => {
            b.classList.remove('active-genre');
          });
          // Add active class to clicked button
          this.classList.add('active-genre');
          
          const genre = this.dataset.genre;
          renderBooks(genre);
        });
      });

      // Show "All Genres" by default
      renderBooks('all');
    });

    // 🎯 AI Recommendation (unchanged)
    async function aiRecommend() {
      const input = document.getElementById('aiSearch');
      const query = input.value.trim();
      if (!query) return;

      document.getElementById('loadingState').classList.remove('hidden');
      document.getElementById('bookGrid').innerHTML = '';

      try {
        const response = await fetch('http://localhost:5000/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            message: `Recommend 6 books for: "${query}". Give titles, authors, ratings, detailed descriptions. Format as JSON list.`,
            userId: 'recommendations'
          })
        });

        const data = await response.json();
        // Parse AI response here if backend returns structured data
        renderBooks('all'); // Fallback to all books

      } catch (error) {
        console.log('Using local books (backend offline)');
        renderBooks('all'); // Show all books as fallback
      } finally {
        document.getElementById('loadingState').classList.add('hidden');
      }
    }

    // ⌨️ Enter key for AI search
    function handleAISearch(event) {
      if (event.key === 'Enter') aiRecommend();
    }

    // 🌙 Theme toggle
    function toggleTheme() {
      document.body.classList.toggle('dark-theme');
    }

    // Initialize focus
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('aiSearch').focus();
    });
  </script>
</body>
</html>
