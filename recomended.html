<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LITBOT - Book Recommendations</title>
  
  <!-- Tailwind + Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            'card-float': 'cardFloat 6s ease-in-out infinite',
            'gradient': 'gradient 3s ease infinite',
          },
          keyframes: {
            cardFloat: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-10px)' }
            },
            gradient: {
              '0%': { backgroundPosition: '0% 50%' },
              '50%': { backgroundPosition: '100% 50%' },
              '100%': { backgroundPosition: '0% 50%' }
            }
          }
        }
      }
    }
  </script>

  <style>
    * { font-family: 'Inter', sans-serif; }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
      min-height: 100vh;
    }
    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .gradient-text {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient 4s ease infinite;
    }
    .book-card {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .book-card:hover {
      transform: translateY(-12px) scale(1.02);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .rating-stars {
      display: flex;
      gap: 0.25rem;
    }
    .rating-stars .filled { color: #fbbf24; }
    .rating-stars .empty { color: #64748b; }
    .active-genre { 
      background: linear-gradient(135deg, #3b82f6, #8b5cf6) !important; 
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.4) !important;
      transform: scale(1.05);
    }
  </style>
</head>

<body class="pt-20 pb-12">
  
  <!-- 🏠 Top Navigation -->
  <nav class="fixed top-0 left-0 right-0 z-50 px-6 py-4 glass backdrop-blur-xl border-b border-white/10">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3 group">
        <div class="w-10 h-10 bg-gradient-to-r from-blue-500 to-purple-500 rounded-xl flex items-center justify-center shadow-lg group-hover:scale-110 transition-all">
          <i class="fas fa-book text-xl"></i>
        </div>
        <span class="font-bold text-xl gradient-text">LITBOT</span>
      </a>
      
      <div class="flex items-center gap-4">
        <a href="chat.html" class="p-2 hover:bg-white/10 rounded-xl transition-all">
          <i class="fas fa-comments text-xl"></i>
        </a>
        <button onclick="toggleTheme()" class="p-2 hover:bg-white/10 rounded-xl transition-all">
          <i class="fas fa-moon text-xl"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- 🎯 Hero Section -->
  <section class="px-6 md:px-12 lg:px-24 py-20 text-center">
    <div class="max-w-4xl mx-auto glass p-12 rounded-3xl border border-white/10 shadow-2xl">
      <div class="mb-8">
        <h1 class="text-5xl md:text-6xl lg:text-7xl font-black mb-6 leading-tight">
          <span class="text-white block">AI-Powered</span>
          <span class="gradient-text block">Book Discovery</span>
        </h1>
        <p class="text-xl md:text-2xl text-gray-300 max-w-2xl mx-auto leading-relaxed">
          Get personalized recommendations by genre, mood, or story. 
          Powered by cutting-edge AI.
        </p>
      </div>
      
      <!-- 🔍 AI Search Bar -->
      <div class="max-w-2xl mx-auto">
        <div class="relative">
          <div class="absolute left-5 top-1/2 -translate-y-1/2 text-gray-500">
            <i class="fas fa-magic text-2xl"></i>
          </div>
          <input 
            id="aiSearch" 
            type="text" 
            placeholder="Tell me a story or mood... (e.g., 'epic fantasy dragons')" 
            class="w-full pl-16 pr-12 py-6 text-xl bg-white/5 glass border-2 border-white/20 rounded-3xl focus:border-blue-500 focus:outline-none focus:ring-4 focus:ring-blue-500/20 transition-all placeholder-gray-500"
            onkeypress="handleAISearch(event)"
          >
          <button onclick="aiRecommend()" class="absolute right-3 top-1/2 -translate-y-1/2 p-3 bg-gradient-to-r from-blue-500 to-purple-500 hover:from-blue-600 hover:to-purple-600 rounded-2xl shadow-lg hover:shadow-blue-500/25 transition-all group">
            <i class="fas fa-sparkles text-xl group-hover:rotate-12"></i>
          </button>
        </div>
        <div class="text-sm text-gray-500 mt-3 flex items-center justify-center gap-2">
          <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
          AI Live • Groq + Llama 3.3
        </div>
      </div>
    </div>
  </section>

  <!-- 🎛️ Filters - 8 Genres -->
  <section class="px-6 md:px-12 lg:px-24 mb-12">
    <div class="max-w-6xl mx-auto">
      <div class="flex flex-wrap gap-3 justify-center mb-8">
        <button class="genre-btn px-6 py-3 bg-white/10 hover:bg-blue-500/20 border border-white/20 rounded-2xl backdrop-blur-sm transition-all font-medium active-genre" data-genre="all">
          <i class="fas fa-th-large mr-2"></i>All Genres
        </button>
        <button class="genre-btn px-6 py-3 bg-white/10 hover:bg-purple-500/20 border border-white/20 rounded-2xl backdrop-blur-sm transition-all font-medium" data-genre="fantasy">
          <i class="fas fa-dragon mr-2"></i>Fantasy
        </button>
        <button class="genre-btn px-6 py-3 bg-white/10 hover:bg-emerald-500/20 border border-white/20 rounded-2xl backdrop-blur-sm transition-all font-medium" data-genre="mystery">
          <i class="fas fa-magnifying-glass mr-2"></i>Mystery
        </button>
        <button class="genre-btn px-6 py-3 bg-white/10 hover:bg-pink-500/20 border border-white/20 rounded-2xl backdrop-blur-sm transition-all font-medium" data-genre="romance">
          <i class="fas fa-heart mr-2"></i>Romance
        </button>
        <button class="genre-btn px-6 py-3 bg-white/10 hover:bg-orange-500/20 border border-white/20 rounded-2xl backdrop-blur-sm transition-all font-medium" data-genre="scifi">
          <i class="fas fa-rocket mr-2"></i>Sci-Fi
        </button>
        <button class="genre-btn px-6 py-3 bg-white/10 hover:bg-indigo-500/20 border border-white/20 rounded-2xl backdrop-blur-sm transition-all font-medium" data-genre="thriller">
          <i class="fas fa-skull-crossbones mr-2"></i>Thriller
        </button>
        <button class="genre-btn px-6 py-3 bg-white/10 hover:bg-amber-500/20 border border-white/20 rounded-2xl backdrop-blur-sm transition-all font-medium" data-genre="historical">
          <i class="fas fa-scroll mr-2"></i>Historical
        </button>
        <button class="genre-btn px-6 py-3 bg-white/10 hover:bg-teal-500/20 border border-white/20 rounded-2xl backdrop-blur-sm transition-all font-medium" data-genre="horror">
          <i class="fas fa-ghost mr-2"></i>Horror
        </button>
      </div>
    </div>
  </section>

  <!-- 📚 Book Grid -->
  <section class="px-6 md:px-12 lg:px-24">
    <div class="max-w-7xl mx-auto">
      <!-- Loading State -->
      <div id="loadingState" class="text-center py-20 hidden">
        <div class="inline-flex items-center gap-3 px-8 py-4 bg-white/10 backdrop-blur-sm rounded-3xl mb-6">
          <div class="w-6 h-6 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
          <span class="font-medium">AI is finding perfect books...</span>
        </div>
      </div>

      <!-- Results Grid -->
      <div id="bookGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
        <!-- Dynamic book cards will appear here -->
      </div>
    </div>
  </section>

  <script>
    // 📚 All Books Database by Genre (48 books total - 6 per genre)
    const booksDatabase = {
      all: [
        { title: 'The Name of the Wind', author: 'Patrick Rothfuss', rating: 4.7, genre: 'fantasy', description: 'A wizard\'s epic journey begins' },
        { title: 'Dune', author: 'Frank Herbert', rating: 4.5, genre: 'scifi', description: 'Space opera masterpiece' },
        { title: 'The Silent Patient', author: 'Alex Michaelides', rating: 4.3, genre: 'mystery', description: 'Psychological thriller' },
        { title: 'Pride and Prejudice', author: 'Jane Austen', rating: 4.4, genre: 'romance', description: 'Classic love story' },
        { title: 'The Girl on the Train', author: 'Paula Hawkins', rating: 4.0, genre: 'thriller', description: 'Gripping suspense' },
        { title: 'The Historian', author: 'Elizabeth Kostova', rating: 4.2, genre: 'historical', description: 'Dracula hunt through history' }
      ],
      fantasy: [
        { title: 'The Name of the Wind', author: 'Patrick Rothfuss', rating: 4.7, genre: 'fantasy', description: 'Kvothe\'s legendary tale begins' },
        { title: 'The Hobbit', author: 'J.R.R. Tolkien', rating: 4.6, genre: 'fantasy', description: 'Bilbo\'s unexpected journey' },
        { title: 'Mistborn', author: 'Brandon Sanderson', rating: 4.7, genre: 'fantasy', description: 'Magic of metals and rebellion' },
        { title: 'The Lies of Locke Lamora', author: 'Scott Lynch', rating: 4.6, genre: 'fantasy', description: 'Gentleman bastard heist' },
        { title: 'The Night Circus', author: 'Erin Morgenstern', rating: 4.5, genre: 'fantasy', description: 'Magical competition of love' },
        { title: 'American Gods', author: 'Neil Gaiman', rating: 4.4, genre: 'fantasy', description: 'Old gods vs new America' }
      ],
      mystery: [
        { title: 'The Silent Patient', author: 'Alex Michaelides', rating: 4.3, genre: 'mystery', description: 'Woman who won\'t speak' },
        { title: 'The Girl with the Dragon Tattoo', author: 'Stieg Larsson', rating: 4.2, genre: 'mystery', description: 'Hacker vs corporate evil' },
        { title: 'Gone Girl', author: 'Gillian Flynn', rating: 4.1, genre: 'mystery', description: 'Marriage gone horribly wrong' },
        { title: 'The Murder of Roger Ackroyd', author: 'Agatha Christie', rating: 4.5, genre: 'mystery', description: 'Poirot\'s greatest twist' },
        { title: 'The Cuckoo\'s Calling', author: 'Robert Galbraith', rating: 4.0, genre: 'mystery', description: 'Strike investigates model death' },
        { title: 'The No. 1 Ladies\' Detective', author: 'Alexander McCall Smith', rating: 4.2, genre: 'mystery', description: 'Botswana\'s gentle sleuth' }
      ],
      romance: [
        { title: 'Pride and Prejudice', author: 'Jane Austen', rating: 4.4, genre: 'romance', description: 'Elizabeth and Darcy\'s enemies-to-lovers' },
        { title: 'The Notebook', author: 'Nicholas Sparks', rating: 4.3, genre: 'romance', description: 'Timeless love against all odds' },
        { title: 'Me Before You', author: 'Jojo Moyes', rating: 4.4, genre: 'romance', description: 'Caregiver changes quadriplegic\'s life' },
        { title: 'It Ends With Us', author: 'Colleen Hoover', rating: 4.2, genre: 'romance', description: 'Breaking cycles of abuse' },
        { title: 'The Kiss Quotient', author: 'Helen Hoang', rating: 4.3, genre: 'romance', description: 'Autistic woman hires escort' },
        { title: 'Beach Read', author: 'Emily Henry', rating: 4.1, genre: 'romance', description: 'Rival authors fall in love' }
      ],
      scifi: [
        { title: 'Dune', author: 'Frank Herbert', rating: 4.5, genre: 'scifi', description: 'Desert planet power struggle' },
        { title: '1984', author: 'George Orwell', rating: 4.6, genre: 'scifi', description: 'Big Brother watches all' },
        { title: 'The Martian', author: 'Andy Weir', rating: 4.4, genre: 'scifi', description: 'Astronaut survives Mars alone' },
        { title: 'Foundation', author: 'Isaac Asimov', rating: 4.3, genre: 'scifi', description: 'Galactic empire\'s fall predicted' },
        { title: 'Neuromancer', author: 'William Gibson', rating: 4.2, genre: 'scifi', description: 'Cyberpunk hacker classic' },
        { title: 'Project Hail Mary', author: 'Andy Weir', rating: 4.6, genre: 'scifi', description: 'Lone astronaut saves Earth' }
      ],
      thriller: [
        { title: 'The Girl on the Train', author: 'Paula Hawkins', rating: 4.0, genre: 'thriller', description: 'Unreliable witness thriller' },
        { title: 'Gone Girl', author: 'Gillian Flynn', rating: 4.1, genre: 'thriller', description: 'Perfect wife disappears' },
        { title: 'The Da Vinci Code', author: 'Dan Brown', rating: 4.0, genre: 'thriller', description: 'Art historian solves murders' },
        { title: 'The Firm', author: 'John Grisham', rating: 4.2, genre: 'thriller', description: 'Lawyer vs mafia firm' },
        { title: 'Shutter Island', author: 'Dennis Lehane', rating: 4.3, genre: 'thriller', description: 'Psych ward conspiracy' },
        { title: 'The Bourne Identity', author: 'Robert Ludlum', rating: 4.1, genre: 'thriller', description: 'Amnesiac spy hunted' }
      ],
      historical: [
        { title: 'The Historian', author: 'Elizabeth Kostova', rating: 4.2, genre: 'historical', description: 'Dracula hunt through centuries' },
        { title: 'All the Light We Cannot See', author: 'Anthony Doerr', rating: 4.5, genre: 'historical', description: 'WWII blind girl and German boy' },
        { title: 'The Book Thief', author: 'Markus Zusak', rating: 4.6, genre: 'historical', description: 'Nazi Germany through Death\'s eyes' },
        { title: 'Pachinko', author: 'Min Jin Lee', rating: 4.4, genre: 'historical', description: 'Korean family in Japan' },
        { title: 'The Nightingale', author: 'Kristin Hannah', rating: 4.5, genre: 'historical', description: 'French sisters in WWII' },
        { title: 'Outlander', author: 'Diana Gabaldon', rating: 4.3, genre: 'historical', description: 'Time travel to 1743 Scotland' }
      ],
      horror: [
        { title: 'The Shining', author: 'Stephen King', rating: 4.4, genre: 'horror', description: 'Overlook Hotel possesses family' },
        { title: 'It', author: 'Stephen King', rating: 4.3, genre: 'horror', description: 'Clown preys on Derry children' },
        { title: 'Dracula', author: 'Bram Stoker', rating: 4.2, genre: 'horror', description: 'Vampire terrorizes England' },
        { title: 'Frankenstein', author: 'Mary Shelley', rating: 4.1, genre: 'horror', description: 'Monster seeks revenge on creator' },
        { title: 'The Haunting of Hill House', author: 'Shirley Jackson', rating: 4.3, genre: 'horror', description: 'Haunted house destroys minds' },
        { title: 'Mexican Gothic', author: 'Silvia Moreno-Garcia', rating: 4.2, genre: 'horror', description: 'Gothic horror in haunted mansion' }
      ]
    };

    // 🧙‍♂️ Genre Icons
    function getGenreIcon(genre) {
      const icons = {
        fantasy: '🧙‍♂️', scifi: '🚀', mystery: '🔍', romance: '💕',
        thriller: '🗡️', historical: '📜', horror: '👻', book: '📚'
      };
      return icons[genre] || '📚';
    }

    // ⭐ Rating Stars
    function generateStars(rating) {
      let stars = '';
      for (let i = 1; i <= 5; i++) {
        stars += i <= Math.floor(rating) 
          ? '<i class="fas fa-star filled"></i>'
          : (rating >= i - 0.5 ? '<i class="fas fa-star-half-alt filled"></i>' : '<i class="far fa-star empty"></i>');
      }
      return stars;
    }

    // 📱 Render 6 Books for Selected Genre
    function renderBooks(genre) {
      const books = booksDatabase[genre] || [];
      const grid = document.getElementById('bookGrid');
      grid.innerHTML = '';

      if (books.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-20">
            <div class="text-6xl mb-6">📚</div>
            <h3 class="text-2xl font-bold mb-4">No books in this genre yet</h3>
          </div>
        `;
        return;
      }

      books.slice(0, 6).forEach((book, index) => {
        const card = document.createElement('div');
        card.className = 'book-card glass p-8 rounded-3xl border border-white/10 hover:border-blue-500/50 cursor-pointer group';
        card.style.animationDelay = `${index * 0.1}s`;
        
        card.innerHTML = `
          <div class="mb-6">
            <div class="text-4xl mb-4">${getGenreIcon(book.genre)}</div>
            <h3 class="font-black text-2xl mb-3 group-hover:text-blue-400 transition-all leading-tight">${book.title}</h3>
            <p class="text-gray-400 mb-2">${book.author}</p>
            <p class="text-gray-500 text-sm mb-4">${book.description}</p>
            <div class="flex items-center justify-between mb-4">
              <div class="rating-stars text-lg">${generateStars(book.rating)}</div>
            </div>
          </div>
          <div class="flex gap-3 pt-4 border-t border-white/10">
            <button class="flex-1 bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 px-6 py-3 rounded-xl font-semibold text-sm shadow-lg transition-all">
              <i class="fas fa-book-open mr-2"></i>Add to List
            </button>
            <button class="p-3 bg-white/10 hover:bg-white/20 rounded-xl transition-all">
              <i class="fas fa-heart text-xl"></i>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // 🎛️ Genre Filter Event Listeners
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('.genre-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          // Remove active class from all buttons
          document.querySelectorAll('.genre-btn').forEach(b => {
            b.classList.remove('active-genre');
          });
          // Add active class to clicked button
          this.classList.add('active-genre');
          
          const genre = this.dataset.genre;
          renderBooks(genre);
        });
      });

      // Show "All Genres" by default
      renderBooks('all');
    });

    // 🎯 AI Recommendation (unchanged)
    async function aiRecommend() {
      const input = document.getElementById('aiSearch');
      const query = input.value.trim();
      if (!query) return;

      document.getElementById('loadingState').classList.remove('hidden');
      document.getElementById('bookGrid').innerHTML = '';

      try {
        const response = await fetch('http://localhost:5000/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            message: `Recommend 6 books for: "${query}". Give titles, authors, ratings, short descriptions. Format as JSON list.`,
            userId: 'recommendations'
          })
        });

        const data = await response.json();
        // Parse AI response here if backend returns structured data
        renderBooks('all'); // Fallback to all books

      } catch (error) {
        console.log('Using local books (backend offline)');
        renderBooks('all'); // Show all books as fallback
      } finally {
        document.getElementById('loadingState').classList.add('hidden');
      }
    }

    // ⌨️ Enter key for AI search
    function handleAISearch(event) {
      if (event.key === 'Enter') aiRecommend();
    }

    // 🌙 Theme toggle
    function toggleTheme() {
      document.body.classList.toggle('dark-theme');
    }

    // Initialize focus
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('aiSearch').focus();
    });
  </script>
</body>
</html>
